<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSplitwise</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <img src="icons/icon48.png" alt="" class="brand__logo" />
      <div>
        <h1 class="brand__name">SmartSplitwise</h1>
        <p class="brand__tag">Split any receipt, fairly.</p>
      </div>
    </header>

    <main class="pop">
      <p class="pop__hint" id="hint">
        Open a store receipt or order page, then scan it to pull in the items,
        tax, and total automatically.
      </p>

      <button class="btn btn--primary" id="scanBtn">
        <span class="btn__icon">⟳</span> Scan this page
      </button>

      <div class="preview" id="preview" hidden>
        <div class="preview__head">
          <span class="preview__site" id="pvSite">—</span>
          <span class="badge" id="pvBadge">—</span>
        </div>
        <div class="preview__stats">
          <div><span id="pvItems">0</span><small>items</small></div>
          <div><span id="pvSubtotal">—</span><small>subtotal</small></div>
          <div><span id="pvTax">—</span><small>tax</small></div>
          <div><span id="pvTotal">—</span><small>total</small></div>
        </div>
        <button class="btn btn--go" id="openBtn">
          Assign &amp; split →
        </button>
      </div>

      <div class="error" id="error" hidden></div>

      <button class="linkbtn" id="manualBtn">or enter a receipt manually →</button>
    </main>

    <footer class="foot">
      <span id="peopleCount">—</span>
      <button class="linkbtn linkbtn--muted" id="resetPeople">reset people</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
