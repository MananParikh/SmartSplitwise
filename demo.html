<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmartSplitwise (preview)</title>
    <link rel="stylesheet" href="app.css" />
    <script>
      // ---- chrome.* mock for local preview only (not shipped) ----
      const _store = {
        ss_people: [
          { id: "p_you", name: "Manan", isMe: true, color: "#34d399" },
          { id: "p_a", name: "Roommate A", isMe: false, color: "#60a5fa" },
          { id: "p_b", name: "Roommate B", isMe: false, color: "#f472b6" },
          { id: "p_c", name: "Roommate C", isMe: false, color: "#fbbf24" },
        ],
        ss_scan: {
          ok: true,
          site: "walmart.com",
          url: "https://www.walmart.com/orders/123",
          title: "Your order",
          currency: "$",
          items: [
            { name: "Great Value Whole Milk", price: 3.98 },
            { name: "Large Eggs 12ct", price: 4.52 },
            { name: "Wheat Bread", price: 2.48 },
            { name: "Bananas (bunch)", price: 1.96 },
            { name: "Chicken Breast 2lb", price: 8.94 },
          ],
          subtotal: 21.88,
          tax: 1.31,
          fees: null,
          discount: null,
          total: 23.19,
          confidence: "high",
          scannedAt: Date.now(),
        },
      };
      window.chrome = {
        storage: {
          local: {
            get(keys, cb) {
              const out = {};
              const arr = Array.isArray(keys) ? keys : [keys];
              arr.forEach((k) => (out[k] = _store[k]));
              const p = Promise.resolve(out);
              return cb ? (p.then(cb), undefined) : p;
            },
            set(obj, cb) {
              Object.assign(_store, obj);
              const p = Promise.resolve();
              return cb ? (p.then(cb), undefined) : p;
            },
            remove(k, cb) {
              (Array.isArray(k) ? k : [k]).forEach((x) => delete _store[x]);
              const p = Promise.resolve();
              return cb ? (p.then(cb), undefined) : p;
            },
          },
        },
        runtime: { getURL: (p) => p },
        tabs: { create() {}, query: () => Promise.resolve([{}]) },
      };
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__brand">
        <img src="icons/icon48.png" alt="" class="topbar__logo" />
        <div>
          <h1>SmartSplitwise</h1>
          <p class="topbar__tag">Assign items, split tax fairly, settle up.</p>
        </div>
      </div>
      <div class="topbar__actions">
        <label class="cur">
          Currency
          <select id="currency">
            <option>$</option><option>€</option><option>£</option><option>₹</option>
          </select>
        </label>
        <button class="ghostbtn" id="clearBtn">Clear all</button>
      </div>
    </header>

    <div class="source" id="source"></div>

    <main class="grid">
      <section class="col">
        <div class="card">
          <div class="card__head">
            <h2>Paste a receipt</h2>
            <button class="chipbtn" id="pasteToggle">show</button>
          </div>
          <p class="card__sub">Paste an itemized receipt to pull out items and totals.</p>
          <div id="pasteWrap" hidden>
            <textarea id="pasteBox" class="pastebox" placeholder="Whole Milk 3.98&#10;Eggs 4.52&#10;Subtotal 8.50&#10;Tax 0.51&#10;Total 9.01"></textarea>
            <div class="pasterow">
              <button class="addbtn" id="parseBtn">Parse receipt</button>
              <span class="paste__hint" id="parseHint"></span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card__head">
            <h2>People</h2>
            <span class="card__hint">tap a name on an item to assign it</span>
          </div>
          <div class="people" id="people"></div>
          <form class="addrow" id="addPersonForm">
            <input id="personName" placeholder="Add a person (e.g. Roommate A)" maxlength="24" autocomplete="off" />
            <button class="addbtn" type="submit">+ Add</button>
          </form>
        </div>

        <div class="card">
          <div class="card__head">
            <h2>Items</h2>
            <div class="card__headbtns">
              <button class="chipbtn" id="everyoneAll">Everyone shares all</button>
              <button class="chipbtn" id="clearAssign">Clear assignments</button>
            </div>
          </div>
          <div id="items" class="items"></div>
          <button class="addbtn addbtn--wide" id="addItem">+ Add item</button>
        </div>

        <div class="card">
          <div class="card__head"><h2>Charges</h2></div>
          <div class="charges">
            <div class="charge"><label>Items subtotal</label><output id="itemsSum">$0.00</output></div>
            <div class="charge"><label for="tax">Tax</label><input type="number" step="0.01" min="0" id="tax" placeholder="0.00" /></div>
            <div class="charge"><label for="fees">Fees / delivery / tip</label><input type="number" step="0.01" min="0" id="fees" placeholder="0.00" /></div>
            <div class="charge"><label for="discount">Discounts</label><input type="number" step="0.01" min="0" id="discount" placeholder="0.00" /></div>
            <div class="charge charge--total"><label>Bill total</label><output id="billTotal">$0.00</output></div>
          </div>
          <p class="charge__note" id="totalNote" hidden></p>
        </div>
      </section>

      <aside class="col col--right">
        <div class="card card--result">
          <div class="card__head">
            <h2>Who owes what</h2>
            <label class="paidby">Paid by <select id="payer"></select></label>
          </div>
          <div id="warnings"></div>
          <div id="shares" class="shares"></div>
          <div class="settle" id="settle"></div>
          <button class="btn btn--copy" id="copyBtn"><span id="copyLabel">Copy summary for Splitwise</span></button>
          <div class="toast" id="toast" hidden>Copied to clipboard ✓</div>
        </div>
      </aside>
    </main>

    <script src="data.js"></script>
    <script src="render.js"></script>
    <script src="parser.js"></script>
    <script src="logic.js"></script>
  </body>
</html>
